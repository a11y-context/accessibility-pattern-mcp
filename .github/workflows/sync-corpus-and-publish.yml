name: Sync corpus and publish

# Keeps the corpus snapshot bundled in this package in step with the corpus repo.
#
# Why this exists: the server does NOT fetch the corpus at runtime. It reads the
# copy baked into the published tarball. So a corpus release reaches MCP users
# only when this package is republished. Before this workflow existed that was a
# manual step, and the published package drifted 20 catalog releases behind.
#
# Runs daily and does nothing on days when the corpus has not moved, so a burst
# of corpus releases coalesces into a single publish.

on:
  schedule:
    # 06:20 UTC daily. Offset off the hour so it is not queued with every other
    # cron job on the hour.
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the corpus revision has not changed"
        type: boolean
        default: false

concurrency:
  group: sync-corpus-and-publish
  cancel-in-progress: false

permissions:
  contents: write
  # Required for npm trusted publishing. The runner mints a short-lived OIDC
  # token that npm verifies against the trusted publisher configured on the
  # package, so there is no NPM_TOKEN to store, rotate, or leak.
  id-token: write

jobs:
  sync:
    name: check corpus revision, publish if changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          # A real token so the version-bump commit can be pushed back.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout corpus repo (public, read-only)
        uses: actions/checkout@v4
        with:
          repository: a11y-context/accessibility-pattern-api
          path: .corpus-src
          fetch-depth: 1

      - name: Compare the PUBLISHED package against the corpus repo
        id: check
        run: |
          set -euo pipefail

          # Read what is ON NPM, deliberately NOT this repo's working tree.
          # What matters is what a user receives on install, and the repo can
          # hold a synced corpus that was never published. That is exactly what
          # happened when the first corpus refresh landed inside a hand-authored
          # PR: repo matched corpus, so a repo-vs-corpus check saw no drift and
          # published nothing, while npm stayed months behind.
          tarball=$(npm view @a11y-context/mcp-server dist.tarball 2>/dev/null || echo "")
          if [ -n "$tarball" ]; then
            rm -rf .published && mkdir -p .published
            curl -sL "$tarball" | tar xz -C .published
            pub_web=$(jq -r '.catalog_revision // "none"' .published/package/corpus/web/react/patterns.json 2>/dev/null || echo "none")
            pub_ios=$(jq -r '.catalog_revision // "none"' .published/package/corpus/ios/swiftui/patterns.json 2>/dev/null || echo "none")
            rm -rf .published
          else
            pub_web="none"; pub_ios="none"
          fi

          upstream_web=$(jq -r '.catalog_revision' .corpus-src/patterns/web/react/catalog-meta.json)
          upstream_ios=$(jq -r '.catalog_revision' .corpus-src/patterns/ios/swiftui/catalog-meta.json)

          echo "published on npm  web/react=$pub_web  ios/swiftui=$pub_ios"
          echo "corpus repo       web/react=$upstream_web  ios/swiftui=$upstream_ios"

          if [ "$pub_web" = "$upstream_web" ] && [ "$pub_ios" = "$upstream_ios" ] \
             && [ "${{ inputs.force }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Published package is already current. Nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "web=$upstream_web" >> "$GITHUB_OUTPUT"
            echo "ios=$upstream_ios" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or newer. The npm bundled with
      # Node 22 is older than that, so upgrade before publishing.
      - name: Upgrade npm for trusted publishing
        if: steps.check.outputs.changed == 'true'
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install
        if: steps.check.outputs.changed == 'true'
        run: npm ci

      - name: Sync each stack
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # sync-corpus copies one stack per invocation.
          npm run sync-corpus -- --source "$GITHUB_WORKSPACE/.corpus-src" --stack web/react
          npm run sync-corpus -- --source "$GITHUB_WORKSPACE/.corpus-src" --stack ios/swiftui

      - name: Build
        if: steps.check.outputs.changed == 'true'
        run: npm run build

      # THE gate. smoke-stdio asserts the SERVER behaves — handshake, tool
      # registration, a listed id resolving, structured errors, the scope
      # filter, no path leaks on an unpopulated stack. It deliberately asserts
      # nothing about which patterns exist, so it stays valid as the corpus
      # moves. A corpus change that breaks the server fails here, before publish.
      - name: stdio handshake smoke
        if: steps.check.outputs.changed == 'true'
        run: node scripts/smoke-stdio.mjs

      # NOT a gate. The regression fixtures are snapshots of corpus content, so
      # they cannot survive a corpus sync by design — gating on them would fail
      # every single run. Regenerating them and committing the result makes the
      # fixture diff a reviewable record of exactly what changed in the
      # published contract for this release.
      - name: Regenerate regression fixtures
        if: steps.check.outputs.changed == 'true'
        run: node scripts/regression-runner.mjs --update

      - name: Commit, version, tag
        if: steps.check.outputs.changed == 'true'
        id: version
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf .corpus-src
          git add corpus/ examples/fixtures/

          # An empty diff means the repo already held this corpus but npm did
          # not — the check step compares against the PUBLISHED package, so
          # reaching here at all means a publish is owed. Commit anyway so the
          # version bump has a parent, and carry on to publish. Skipping here
          # is what silently swallowed the first attempted release.
          if git diff --cached --quiet; then
            echo "Repo corpus already matches; publishing to close the gap with npm."
            git commit --allow-empty -m "Republish: corpus web/react ${{ steps.check.outputs.web }}, ios/swiftui ${{ steps.check.outputs.ios }}"
          else
            git commit -m "Sync corpus to web/react ${{ steps.check.outputs.web }}, ios/swiftui ${{ steps.check.outputs.ios }}"
          fi

          # Content-only refresh: patch bump. npm version also creates the tag.
          npm version patch -m "Release %s — corpus web/react ${{ steps.check.outputs.web }}, ios/swiftui ${{ steps.check.outputs.ios }}"

          new_version=$(node -p "require('./package.json').version")
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

          git push --follow-tags origin HEAD:main

      # Authenticates via OIDC against the trusted publisher registered on the
      # package. No token: this package is configured to disallow bypass-2FA
      # tokens, so every token-based publish fails with EOTP regardless of how
      # the token is scoped. Trusted publishing is the supported path.
      - name: Publish to npm
        if: steps.version.outputs.published == 'true'
        run: npm publish --access public

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ steps.check.outputs.changed }}" != "true" ]; then
              echo "### Corpus already current — nothing published"
            elif [ "${{ steps.version.outputs.published }}" = "true" ]; then
              echo "### Published \`${{ steps.version.outputs.new_version }}\`"
              echo ""
              echo "- web/react → \`${{ steps.check.outputs.web }}\`"
              echo "- ios/swiftui → \`${{ steps.check.outputs.ios }}\`"
            else
              echo "### Revision changed but no content diff — nothing published"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
